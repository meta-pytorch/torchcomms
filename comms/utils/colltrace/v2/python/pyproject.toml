[project]
name = "colltrace"
version = "0.1.0"
requires-python = ">=3.10"
description = "colltrace v2 Python bindings (comms/utils/colltrace/v2), linked against libcommsutils"
license = "BSD-3-Clause"
authors = [
    { name = "Meta Platforms, Inc." }
]

[build-system]
requires = [
    "setuptools>=61",
    "pybind11>=2.11",
]
build-backend = "setuptools.build_meta"
