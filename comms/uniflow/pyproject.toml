# Packaging for the `uniflow` Python package, whose `_core` extension SGLang's
# uniflow KV transfer backend imports.
#
# The distribution is named `torchcomms-uniflow` because the `uniflow` name on
# PyPI belongs to an unrelated project. The import name is unaffected: this
# installs the `uniflow` package, and `import uniflow._core` is what consumers
# use.
#
# Building from source needs a GPU toolkit, either the CUDA toolkit or ROCm, and
# spdlog, fmt and pybind11. See README.md for which of those to take from the
# system and which to point at header trees, and for the ROCm invocation.

[build-system]
requires = ["scikit-build-core>=1.1", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "torchcomms-uniflow"
dynamic = ["version", "dependencies"]
description = "UniFlow point-to-point transport, and its Python binding"
readme = "python/README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/meta-pytorch/torchcomms"

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.source-dir = "."
cmake.build-type = "Release"
cmake.args = [
  "-DUNIFLOW_BUILD_PYTHON=ON",
  "-DUNIFLOW_BUILD_SHARED_LIBS=ON",
  "-DUNIFLOW_BUILD_TESTS=OFF",
  "-DUNIFLOW_BUILD_BENCHMARKS=OFF",
  "-DUNIFLOW_INSTALL_CPP=ON",
  "-DUNIFLOW_USE_SYSTEM_SPDLOG=OFF",
]
wheel.install-dir = "uniflow"
wheel.packages = []
sdist.exclude = [
  ".claude/**",
  ".llms/**",
  "amd/**",
  "**/BUCK",
  "**/TARGETS",
  "**/*.bzl",
  "**/PACKAGE",
  ".clang-tidy",
  "**/benchmarks/**",
  "docs/**",
  "fb/**",
  "controller/tests/**",
  "core/tests/**",
  "drivers/*/mock/**",
  "drivers/*/tests/**",
  "executor/tests/**",
  "fb/tests/**",
  "logging/tests/**",
  "tests/CMakeLists.txt",
  "tests/cmake/**",
  "tests/headers/**",
  "tests/integration/**",
  "tests/package/**",
  "tests/py/test_uniflow_integration.py",
  "tests/unit/**",
  "transport/tests/**",
  "transport/*/tests/**",
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION"
regex = "^(?P<value>.+?)\\s*$"

[[tool.dynamic-metadata]]
provider = { path = "packaging", module = "uniflow_metadata" }
