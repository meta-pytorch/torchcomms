[build-system]
requires = ["scikit-build-core>=0.11.1", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "torchcomms-uniflow"
dynamic = ["version"]
description = "UniFlow point-to-point transport, and its Python binding"
readme = "python/README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/meta-pytorch/torchcomms"

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.source-dir = "."
cmake.build-type = "Release"
wheel.install-dir = "uniflow"
wheel.packages = []
sdist.exclude = [
  ".claude/**",
  ".llms/**",
  "amd/**",
  "**/BUCK",
  "**/TARGETS",
  "**/*.bzl",
  "**/PACKAGE",
  ".clang-tidy",
  "**/benchmarks/**",
  "docs/**",
  "fb/**",
  "controller/tests/**",
  "core/tests/**",
  "drivers/*/mock/**",
  "drivers/*/tests/**",
  "executor/tests/**",
  "logging/tests/**",
  "tests/CMakeLists.txt",
  "tests/cmake/**",
  "tests/headers/**",
  "tests/integration/**",
  "tests/package/**",
  "tests/registry/**",
  "tests/py/test_uniflow_integration.py",
  "tests/unit/**",
  "transport/tests/**",
  "transport/*/tests/**",
]

[tool.scikit-build.cmake.define]
UNIFLOW_BUILD_PYTHON = "ON"
UNIFLOW_BUILD_SHARED_LIBS = "ON"
UNIFLOW_BUILD_TESTS = "OFF"
UNIFLOW_BUILD_BENCHMARKS = "OFF"
UNIFLOW_INSTALL_CPP = "OFF"
UNIFLOW_INSTALL_PYTHON_TESTS = "OFF"
UNIFLOW_USE_SYSTEM_SPDLOG = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>.+?)\\s*$"
