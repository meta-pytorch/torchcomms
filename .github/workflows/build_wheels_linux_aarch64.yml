name: Build Linux Aarch64 Wheels

on:
  pull_request:
  push:
    branches:
      - main
      - nightly
      - release/*
    tags:
        # NOTE: Binary build pipelines should only get triggered on release candidate builds
        # Release candidate tags look like: v1.11.0-rc1
        - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
  workflow_dispatch:

jobs:
  generate-matrix:
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      os: linux-aarch64
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      with-cuda: enable
      with-rocm: disable
      with-cpu: disable

  filter-matrix:
    needs: generate-matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/setup-python@v6
      - name: Checkout torchcomms
        uses: actions/checkout@v6
        with:
          repository: meta-pytorch/torchcomms
      # test-infra@main can list a CUDA version days before its torch nightly
      # reaches download.pytorch.org; building against a torch that does not
      # exist fails every affected coordinate.
      - name: Drop coordinates with no published torch wheel
        id: filter
        env:
          MAT: ${{ needs.generate-matrix.outputs.matrix }}
        run: |
          set -eu
          MATRIX_BLOB="$( python .github/scripts/filter_matrix_by_torch_wheels.py --architecture aarch64 )"
          echo "matrix=${MATRIX_BLOB}" >> "${GITHUB_OUTPUT}"

  build:
    needs: filter-matrix
    name: ${{ matrix.repository }}
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@main
    with:
      repository: meta-pytorch/torchcomms
      ref: ""
      pre-script: ""
      # Post-script only: resource + sccache stats after the build. The
      # aarch64 legs are otherwise blind to whether the cache did anything.
      post-script: "scripts/ci_log_resources_post.sh"
      build-platform: "python-build-package"
      build-command: "scripts/_build_wheel.sh"
      smoke-test-script: "scripts/smoke_test.py"
      package-name: torchcomms
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      build-matrix: ${{ needs.filter-matrix.outputs.matrix }}
      trigger-event: ${{ github.event_name }}
      architecture: aarch64
      #setup-miniconda: false
      runner: linux.arm64.r7g.12xlarge.memory
