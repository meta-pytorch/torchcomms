name: Build and test torchcomms

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build_pip_wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: "linux.g5.12xlarge.nvidia.gpu"
            gpu-arch-type: "cuda"
            gpu-arch-version: "13.0"
            torch-version: "stable"
          - runs-on: "linux.g5.12xlarge.nvidia.gpu"
            gpu-arch-type: "cuda"
            gpu-arch-version: "13.0"
            torch-version: "nightly"
          - runs-on: "linux.g5.12xlarge.nvidia.gpu"
            gpu-arch-type: "cuda"
            gpu-arch-version: "13.0"
            torch-version: "nightly"
            build-flags: "USE_NCCLX=0 USE_TRANSPORT=0"

    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      timeout: 60
      runner: ${{ matrix.runs-on }}
      gpu-arch-type: ${{ matrix.gpu-arch-type }}
      gpu-arch-version: ${{ matrix.gpu-arch-version }}
      upload-artifact: build-artifacts-${{ matrix.torch-version }}-${{ matrix.gpu-arch-type }}-${{ matrix.gpu-arch-version }}-${{ matrix.build-flags }}
      script: |
        set -ex
        source .github/scripts/setup_env.sh --with-cmake --cuda-version "${{ matrix.gpu-arch-version }}" "${{ matrix.torch-version }}"

        export ${{ matrix.build-flags }}
        BUILD_JOBS=$(($(nproc) - 2))
        if ((BUILD_JOBS < 1)); then
          BUILD_JOBS=1
        elif ((BUILD_JOBS > 32)); then
          BUILD_JOBS=32
        fi
        export CMAKE_BUILD_PARALLEL_LEVEL="${BUILD_JOBS}"
        export NCCL_BUILD_JOBS="${BUILD_JOBS}"

        # Build wheel
        pip install build
        python -m build --wheel --no-isolation

        mkdir -p "${RUNNER_ARTIFACT_DIR}"
        cp dist/*.whl "${RUNNER_ARTIFACT_DIR}/"

        python -c "import torch; print(torch.__version__)" > "${RUNNER_ARTIFACT_DIR}/torch_version.txt"

  build_and_run_cpp_tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: "linux.g5.12xlarge.nvidia.gpu"
            gpu-arch-type: "cuda"
            gpu-arch-version: "13.0"
            torch-version: "stable"
          - runs-on: "linux.g5.12xlarge.nvidia.gpu"
            gpu-arch-type: "cuda"
            gpu-arch-version: "13.0"
            torch-version: "nightly"

    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      timeout: 60
      runner: ${{ matrix.runs-on }}
      gpu-arch-type: ${{ matrix.gpu-arch-type }}
      gpu-arch-version: ${{ matrix.gpu-arch-version }}
      script: |
        set -ex
        source .github/scripts/setup_env.sh --with-cmake --cuda-version "${{ matrix.gpu-arch-version }}" "${{ matrix.torch-version }}"

        export DISABLED_TESTS="${{ vars.DISABLED_TESTS }}"

        # Build and run C++ tests
        cmake -B build_tests -G Ninja -DBUILD_TESTS=ON
        cmake --build build_tests
        cd build_tests && ctest --output-on-failure

  run_py_tests:
    needs: build_pip_wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: "linux.g5.12xlarge.nvidia.gpu"
            gpu-arch-type: "cuda"
            gpu-arch-version: "13.0"
            torch-version: "stable"
          - runs-on: "linux.g5.12xlarge.nvidia.gpu"
            gpu-arch-type: "cuda"
            gpu-arch-version: "13.0"
            torch-version: "nightly"
          - runs-on: "linux.g5.12xlarge.nvidia.gpu"
            gpu-arch-type: "cuda"
            gpu-arch-version: "13.0"
            torch-version: "nightly"
            build-flags: "USE_NCCLX=0 USE_TRANSPORT=0"

    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      timeout: 120
      runner: ${{ matrix.runs-on }}
      gpu-arch-type: ${{ matrix.gpu-arch-type }}
      gpu-arch-version: ${{ matrix.gpu-arch-version }}
      download-artifact: build-artifacts-${{ matrix.torch-version }}-${{ matrix.gpu-arch-type }}-${{ matrix.gpu-arch-version }}-${{ matrix.build-flags }}
      script: |
        set -ex
        TORCH_VERSION=$(cat "${RUNNER_ARTIFACT_DIR}/torch_version.txt")
        source .github/scripts/setup_env.sh --cuda-version "${{ matrix.gpu-arch-version }}" --torch-version "$TORCH_VERSION" "${{ matrix.torch-version }}"

        export ${{ matrix.build-flags }}
        export DISABLED_TESTS="${{ vars.DISABLED_TESTS }}"

        # Install from pre-built wheel (skip build step)
        WHEEL=$(ls "${RUNNER_ARTIFACT_DIR}"/*.whl)
        pip install "${WHEEL}[dev]"

        python -c "import torchcomms"

        # Run Python tests
        comms/torchcomms/scripts/run_tests_unit_py.sh
        comms/torchcomms/scripts/run_tests_integration_py.sh

  # Single pass/fail signal for the jobs above. A matrix job that is skipped
  # because a job it needs failed reports one unexpanded check whose conclusion
  # is "skipped", which downstream tooling can read as green; this gate turns
  # any failed or skipped build or test job into a failure. A cancelled job is
  # not treated as a failure so that job timeouts keep their current
  # non-blocking behavior, and !cancelled() keeps the gate from running in a
  # workflow run superseded by the concurrency group.
  tests_gate:
    needs: [build_pip_wheel, build_and_run_cpp_tests, run_py_tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every build and test job to have run and passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" == "failure" || "${result}" == "skipped" ]]; then
              echo "A build or test job did not pass (${result})."
              exit 1
            fi
          done
