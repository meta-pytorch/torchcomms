name: Build Linux Wheels

on:
  pull_request:
  push:
    branches:
      - main
      - nightly
      - release/*
    tags:
        # NOTE: Binary build pipelines should only get triggered on release candidate builds
        # Release candidate tags look like: v1.11.0-rc1
        - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
  schedule:
    # 11:30 UTC, the time pytorch/test-infra's trigger_nightly.yml used to cut
    # our nightly branch for us. Builds main.
    - cron: 30 11 * * *
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the wheels to the nightly index, built from the selected branch
        type: boolean
        default: false

jobs:
  # The nightly is built straight from the tip of main: the `nightly` branch is no
  # longer cut, because a push to it needs to get past the Meta CLA ruleset. Upload
  # is allowed by `trigger-event: schedule`, not by the branch name.
  source-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Record the commit this build is made from
        env:
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          {
            echo "### Source commit"
            echo "[\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "ref \`${GITHUB_REF_NAME}\`, event \`${GITHUB_EVENT_NAME}\`, publish \`${PUBLISH}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  generate-matrix:
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      os: linux
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      with-cuda: enable
      with-rocm: enable
      with-cpu: disable

  configure-matrix:
    needs: generate-matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-runners.outputs.matrix }}
    steps:
      - id: set-runners
        env:
          MATRIX: ${{ needs.generate-matrix.outputs.matrix }}
        run: |
          patched=$(python3 - <<'PY'
          import json, os
          runners = {
              "cuda": "linux.g5.12xlarge.nvidia.gpu",
              "rocm": "linux.4xlarge",
          }
          matrix = json.loads(os.environ["MATRIX"])
          for entry in matrix["include"]:
              runner = runners.get(entry.get("gpu_arch_type"))
              if runner:
                  entry["validation_runner"] = runner
          print(json.dumps(matrix))
          PY
          )
          echo "matrix=${patched}" >> "$GITHUB_OUTPUT"

  filter-matrix:
    needs: configure-matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/setup-python@v6
      - name: Checkout torchcomms
        uses: actions/checkout@v6
        with:
          repository: meta-pytorch/torchcomms
      # test-infra@main can list a CUDA version days before its torch nightly
      # reaches download.pytorch.org; building against a torch that does not
      # exist fails every affected coordinate.
      - name: Drop coordinates with no published torch wheel
        id: filter
        env:
          MAT: ${{ needs.configure-matrix.outputs.matrix }}
        run: |
          set -eu
          MATRIX_BLOB="$( python .github/scripts/filter_matrix_by_torch_wheels.py --architecture x86_64 )"
          echo "matrix=${MATRIX_BLOB}" >> "${GITHUB_OUTPUT}"

  build:
    needs: filter-matrix
    name: ${{ matrix.repository }}
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@main
    with:
      repository: meta-pytorch/torchcomms
      # Build the commit of this run (main on the schedule). The reusable workflow's
      # `ref` defaults to the nightly branch, which is no longer cut.
      ref: ${{ github.sha }}
      pre-script: "scripts/ci_log_resources_pre.sh"
      post-script: "scripts/ci_log_resources_post.sh"
      build-platform: "python-build-package"
      build-command: "scripts/_build_wheel.sh"
      smoke-test-script: "scripts/smoke_test.py"
      package-name: torchcomms
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      build-matrix: ${{ needs.filter-matrix.outputs.matrix }}
      # The reusable workflow uploads only for `schedule`, so a manual run that asks to
      # publish is reported to it as one.
      trigger-event:
        ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) && 'schedule' || github.event_name }}
