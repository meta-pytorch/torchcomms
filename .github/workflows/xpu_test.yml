name: xpu-test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  id-token: write
  contents: read
  # REQUIRED: Allow reading actions runner statuses from the API
  actions: read

concurrency:
  group: xpu_ci_test-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Don't run on forked repos or empty test matrix
    if: github.repository_owner == 'meta-pytorch'
    timeout-minutes: 120
    # Shared label carried by both the IDC (PVC) and client (BMG) pools, so the
    # job lands on whichever pool has a free runner. Note that a list of labels
    # here would mean "runner has ALL of these", not "any of these".
    runs-on: linux.xpu.dist
    env:
      DOCKER_IMAGE: ubuntu:24.04
    steps:
      - name: Checkout Torchcomms
        uses: actions/checkout@v4
        with:
          path: torchcomms

      - name: Clean all stopped docker containers
        if: always()
        shell: bash
        run: |
          # Prune all stopped containers.
          # If other runner is pruning on this node, will skip.
          nprune=$(ps -ef | grep -c "docker container prune")
          if [[ $nprune -eq 1 ]]; then
            docker container prune -f
          fi

      - name: Runner health check xpu-smi
        if: always()
        shell: bash
        run: |
          echo "ZE_AFFINITY_MASK=${ZE_AFFINITY_MASK}" >> $GITHUB_ENV
          timeout 30 xpu-smi discovery || true
          timeout 30 xpu-smi topology -m || true

      - name: Runner health check GPU count
        if: always()
        shell: bash
        run: |
          ngpu=$(timeout 30 clinfo -l | grep -c -E 'Device' || true)
          msg="Please file an issue on meta-pytorch/torchcomms reporting the faulty runner. Include a link to the runner logs so the runner can be identified"
          if [[ $ngpu -eq 0 ]]; then
            echo "Error: Failed to detect any GPUs on the runner"
            echo "$msg"
            exit 1
          fi

      - name: Runner diskspace health check
        uses: pytorch/pytorch/.github/actions/diskspace-cleanup@main
        if: always()

      - name: Preserve github env variables for use in docker
        shell: bash
        run: |
          env | grep '^GITHUB' >> "/tmp/github_env_${GITHUB_RUN_ID}"
          env | grep '^CI' >> "/tmp/github_env_${GITHUB_RUN_ID}"

      - name: XPU set GPU_FLAG
        shell: bash
        run: |
          # Add render group for container creation.
          render_gid=$(cat /etc/group | grep render | cut -d: -f3)
          echo "GPU_FLAG=--device=/dev/mem --device=/dev/dri --group-add video --group-add $render_gid" >> "${GITHUB_ENV}"
      
      # The job can land on either the IDC (PVC) or client (BMG) pool, so select
      # the OMIX channel from the GPU actually present on this runner. This
      # mirrors the device detection in the runner setup script that assigns the
      # pool labels. The runner labels themselves are not usable here: they are
      # only exposed via the API, and these runners are registered at the org
      # level, so the repo-scoped runners endpoint does not list them.
      - name: Select OMIX Repo
        shell: bash
        run: |
          device_list=$(timeout 30 clinfo -l || true)
          msg="Please file an issue on meta-pytorch/torchcomms reporting the faulty runner. Include a link to the runner logs so the runner can be identified"
          if echo "$device_list" | grep -q 'Intel(R) Data Center GPU Max'; then
            echo "OMIX_REPO=intel-omix-pvc" >> "${GITHUB_ENV}"
            echo "Detected Data Center GPU Max, selected PVC OMIX channel"
          elif echo "$device_list" | grep -q 'Intel(R) Arc(TM) Pro B60 Graphics'; then
            echo "OMIX_REPO=intel-omix" >> "${GITHUB_ENV}"
            echo "Detected Arc Pro B60, selected client BMG OMIX channel"
          else
            echo "Error: could not determine the XPU device on this runner"
            echo "clinfo -l reported: ${device_list}"
            echo "$msg"
            exit 1
          fi

      - name: Get docker image
        run: |
          docker pull "${{ env.DOCKER_IMAGE }}"

      - name: Test
        id: test
        env:
          TEST_COMMAND: torchcomms/.github/scripts/xpu_test.sh
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA1: ${{ github.event.pull_request.head.sha || github.sha }}
          RUNNER_NAME: ${{ runner.name }}
          ZE_AFFINITY_MASK: ${{ env.ZE_AFFINITY_MASK }}
          DISABLED_TESTS: ${{ vars.DISABLED_TESTS }}
          OMIX_VERSION: 0.4.0
          OMIX_REPO: ${{ env.OMIX_REPO }}
        timeout-minutes: 120
        run: |
          set -x
          container_name=$(docker run \
            ${GPU_FLAG:-} \
            -e PR_NUMBER \
            -e GITHUB_ACTIONS \
            -e GITHUB_REPOSITORY \
            -e GITHUB_WORKFLOW \
            -e GITHUB_JOB \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_NUMBER \
            -e GITHUB_RUN_ATTEMPT \
            -e ZE_AFFINITY_MASK \
            -e DISABLED_TESTS \
            -e OMIX_VERSION \
            -e OMIX_REPO \
            -e JOB_ID \
            -e BRANCH \
            -e SHA1 \
            -e RUNNER_NAME \
            --ulimit stack=10485760:83886080 \
            --ulimit core=0 \
            --security-opt seccomp=unconfined \
            --cap-add=SYS_PTRACE \
            --shm-size="8g" \
            --tty \
            --detach \
            --privileged \
            -v /dev/dri:/dev/dri \
            -v /dev/dri/by-path:/dev/dri/by-path \
            -v /home/jenkins/miniforge3:/home/jenkins/miniforge3 \
            -v "${GITHUB_WORKSPACE}:/var/lib/jenkins/workspace" \
            -v "${DLE_PATH}:${DLE_PATH}" \
            -w /var/lib/jenkins/workspace \
            "${DOCKER_IMAGE}"
          )
          # save container name for later step
          echo "CONTAINER_NAME=${container_name}" >> "$GITHUB_ENV"
          docker exec -t "${container_name}" sh -c "bash ${TEST_COMMAND}"

      - name: Stop container before exit
        if: always()
        run: |
          docker stop "${{ env.CONTAINER_NAME }}"

      - name: Teardown XPU
        if: always()
        shell: bash
        run: |
          # Prune all stopped containers.
          # If other runner is pruning on this node, will skip.
          nprune=$(ps -ef | grep -c "docker container prune")
          if [[ $nprune -eq 1 ]]; then
            docker container prune -f
          fi
      
      - name: Cleanup workspace
        if: always()
        run: sudo rm -rf ${{ github.workspace }}/*
