name: Build RCCL

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/build_test_rccl.yaml
      - build_rccl.sh
      - comms/torchcomms/scripts/run_tests_integration_rccl_py.sh
      - comms/torchcomms/rccl/**
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
      id-token: write
      contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RCCL
            runs-on: linux.rocm.gpu.meta-pytorch.mi350.4
            gpu-arch-type: "rocm"
            gpu-arch-version: "10.0"
            torch-spec: '--pre torch --index-url https://download.pytorch.org/whl/nightly/rocm10.0'
            cmake-version: "latest"
    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    with:
      timeout: 180
      runner: ${{ matrix.runs-on }}
      gpu-arch-type: ${{ matrix.gpu-arch-type }}
      gpu-arch-version: ${{ matrix.gpu-arch-version }}
      job-name: RCCL ROCm ${{ matrix.gpu-arch-version }}
      script: |
        set -ex
        # use faster libmamba solver
        conda config --set solver libmamba

        # TODO: remove dependency on fbwhoami
        echo "DEVICE_NAME=$(hostname)" > /etc/fbwhoami
        cat /etc/fbwhoami

        # For picking C++ 20 compiler from toolset-13
        export PATH=/opt/rh/gcc-toolset-13/root/usr/bin:$PATH
        export CXX=/opt/rh/gcc-toolset-13/root/usr/bin/c++
        export CC=/opt/rh/gcc-toolset-13/root/usr/bin/cc

        conda create -n venv python=3.12 -y
        conda activate venv
        python -m pip install --upgrade pip
        conda install conda-forge::libopenssl-static conda-forge::rsync -y

        pip install ${{ matrix.torch-spec }}

        if [ "${{ matrix.cmake-version }}" = "latest" ]; then
          conda install -y cmake
        else # default to latest
          conda install -y cmake==${{ matrix.cmake-version }}
        fi

        pip install -r requirements.txt
        pip install -r dev-requirements.txt

        # TheRock: SDK is under site-packages/_rocm_sdk_devel, not /opt/rocm. The
        # torch wheel only pulls rocm[libraries,device-all], which ships
        # librccl.so.1 but no headers, so RCCL_INCLUDE has to come from the
        # image's devel tree exported by /etc/rocm_env.sh. rocm-sdk-devel is not
        # published on the nightly index, so `rocm-sdk path` can fail here; only
        # take its answer when it resolves to a tree that actually has RCCL.
        if [ -f /etc/rocm_env.sh ]; then
          # shellcheck source=/dev/null
          source /etc/rocm_env.sh
        fi
        if command -v rocm-sdk >/dev/null 2>&1; then
          _rocm_root="$(rocm-sdk path --root 2>/dev/null || true)"
          _rocm_bin="$(rocm-sdk path --bin 2>/dev/null || true)"
          if [ -n "${_rocm_root}" ] && [ -f "${_rocm_root}/lib/librccl.so" ]; then
            export ROCM_HOME="${_rocm_root}"
            if [ -n "${_rocm_bin}" ]; then
              export PATH="${_rocm_bin}:${PATH}"
            fi
          fi
        fi
        if [ -z "${ROCM_HOME:-}" ] && [ -f /opt/rocm/lib/librccl.so ]; then
          export ROCM_HOME=/opt/rocm
        fi
        if [ -z "${ROCM_HOME:-}" ] || [ ! -f "${ROCM_HOME}/lib/librccl.so" ]; then
          echo "Could not find librccl.so (ROCM_HOME=${ROCM_HOME:-unset})" >&2
          find /opt /usr -name 'librccl.so*' 2>/dev/null >&2 || true
          exit 1
        fi
        if [ ! -f "${ROCM_HOME}/include/rccl/rccl.h" ]; then
          echo "Found librccl.so but no rccl.h under ${ROCM_HOME}/include/rccl" >&2
          exit 1
        fi
        export RCCL_INCLUDE="${ROCM_HOME}/include/rccl"
        export LD_LIBRARY_PATH="${ROCM_HOME}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
        echo "Using ROCM_HOME=${ROCM_HOME}"

        # Diagnostics only; never fail the job here. The SDK ships as several
        # wheels, so record which copy of RCCL we build against, whether its
        # dependencies resolve, and which GPUs the runner exposes.
        echo "::group::ROCm toolchain"
        cat "${ROCM_HOME}/.info/version" 2>/dev/null || true
        ls -l "${ROCM_HOME}"/lib/librccl.so* || true
        grep -E '^#define (NCCL|RCCL)_(MAJOR|MINOR|PATCH)' "${RCCL_INCLUDE}/rccl.h" || true
        ldd "${ROCM_HOME}/lib/librccl.so" | grep 'not found' || true
        find /opt/conda -name 'librccl.so*' 2>/dev/null || true
        hipcc --version 2>/dev/null | head -5 || true
        rocm_agent_enumerator 2>/dev/null | sort -u || true
        rocm-smi --showproductname 2>/dev/null | grep 'Card Series' || true
        env | grep -iE 'rocm|hsa|hip|rccl' | sort || true
        echo "::endgroup::"

        ./build_rccl.sh
        pip install numpy
        USE_SYSTEM_LIBS=1 USE_NCCL=0 USE_NCCLX=0 USE_GLOO=0 USE_RCCL=1 USE_TRANSPORT=OFF pip install --no-build-isolation -v -e .

        python -c "import torch; print(f'PyTorch version: {torch.__version__}')"
        python -c "import torch; print(f'HIP available: {torch.cuda.is_available()}')"
        python -c "import torchcomms; print('TorchComms imported successfully')"

        # The integration tests need 4 visible GPUs, so report the devices and
        # the RCCL the extension actually loaded before running them.
        echo "::group::Runtime devices and linkage"
        python -c "
        import torch
        print('hip', torch.version.hip, 'available', torch.cuda.is_available())
        count = torch.cuda.device_count()
        print('device_count', count)
        for i in range(count):
            p = torch.cuda.get_device_properties(i)
            print(i, p.name, getattr(p, 'gcnArchName', '?'))
        if count < 4:
            print(f'WARNING: integration tests launch 4 ranks but only {count} GPUs are visible')
        " || true
        _tc_dir="$(python -c 'import os, torchcomms; print(os.path.dirname(torchcomms.__file__))' 2>/dev/null || true)"
        echo "torchcomms: ${_tc_dir:-unknown}"
        if [ -n "${_tc_dir}" ]; then
          ldd "${_tc_dir}"/*.so 2>/dev/null | grep -iE 'rccl|amdhip|not found' | sort -u || true
        fi
        echo "::endgroup::"

        # Test RCCL backend availability
        python -c "
        import traceback
        import torch
        import torchcomms
        try:
            comm = torchcomms.new_comm('rccl', torch.device('hip'), 'test_comm')
            print('RCCL backend available')
        except Exception:
            print('RCCL backend test failed:')
            traceback.print_exc()
        "

        # Run integration tests
        echo "Running RCCL integration tests..."
        comms/torchcomms/scripts/run_tests_integration_rccl_py.sh
